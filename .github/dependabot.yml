version: 2
updates:
  - package-ecosystem: "gomod"
    open-pull-requests-limit: 5
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "master"
    labels:
      - "dependencies"
      - "security"
    assignees:
      - "kesor"

  - package-ecosystem: "github-actions"
    open-pull-requests-limit: 5
    directory: "/"
    schedule:
      interval: "weekly"
    target-branch: "master"
    labels:
      - "dependencies"
      - "security"
      - "github-actions"
    assignees:
      - "kesor"
