name: Dependabot Auto-Merge

on:
  workflow_run:
    workflows: ["Go CI", "CodeQL"]
    types: [completed]

permissions:
  contents: read
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.actor.login == 'dependabot[bot]' && startsWith(github.event.workflow_run.head_branch, 'dependabot/')
    steps:
      - name: Find and merge Dependabot PR
        run: |
          PR=$(gh pr list --head "${{ github.event.workflow_run.head_branch }}" --json number,author -q '.[0] | select(.author.login == "dependabot[bot]") | .number')
          if [ -n "$PR" ]; then
            gh pr merge --auto --squash "$PR"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
